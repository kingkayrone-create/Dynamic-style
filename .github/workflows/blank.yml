
name: Build DynaIsland Pro

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools not found"
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        run: |
          yes | "$sdkmanager" --licenses || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/dynaisland
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DynaIsland"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.dynaisland"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.dynaisland"
                  minSdk = 26
                  targetSdk = 28
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <application
                  android:theme="@style/AppTheme"
                  android:label="DynaIsland Pro"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".IslandService"
                      android:exported="false"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#78B7FF</item>
                  <item name="android:statusBarColor">#080B14</item>
                  <item name="android:navigationBarColor">#080B14</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/dynaisland/MainActivity.kt <<'EOF'
          package com.dynaisland

          import android.app.*
          import android.os.*
          import android.content.*
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.provider.Settings
          import android.view.*
          import android.widget.*

          private fun glass(color: Int, radius: Float, stroke: Int = 0) =
              GradientDrawable().apply {
                  setColor(color)
                  cornerRadius = radius
                  if (stroke != 0) setStroke(2, stroke)
              }

          class MainActivity : Activity() {
              private val bg = Color.rgb(8, 11, 22)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = bg
                  window.navigationBarColor = bg

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 24, 24, 24)
                      setBackgroundColor(bg)
                  }

                  fun label(value: String, size: Float) {
                      root.addView(TextView(this).apply {
                          text = value
                          textSize = size
                          setTextColor(Color.WHITE)
                          setPadding(4, 12, 4, 12)
                      })
                  }

                  fun button(value: String, action: () -> Unit) {
                      root.addView(Button(this).apply {
                          text = value
                          setTextColor(Color.WHITE)
                          background = glass(
                              0xFF17263D.toInt(), 28f,
                              0xFF579BFF.toInt()
                          )
                          setOnClickListener { action() }
                      })
                  }

                  fun send(action: String, position: String = "top") {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              android.net.Uri.parse("package:$packageName")
                          ))
                          return
                      }

                      startService(
                          Intent(this, IslandService::class.java)
                              .setAction(action)
                              .putExtra("position", position)
                      )
                  }

                  label("DynaIsland Pro", 30f)
                  label("LIQUID GLASS  •  BLUE EDITION", 14f)

                  label("Your Dynamic Island", 21f)
                  label("A floating pill for your Android screen.", 15f)

                  button("Allow Appear on top") {
                      startActivity(Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          android.net.Uri.parse("package:$packageName")
                      ))
                  }

                  button("Start Dynamic Island") { send("START") }
                  button("Position: Top") { send("MOVE", "top") }
                  button("Position: Middle") { send("MOVE", "middle") }
                  button("Position: Bottom") { send("MOVE", "bottom") }
                  button("Remove Dynamic Island") { send("STOP") }

                  label("Drag the pill to reposition it. Tap to expand.", 14f)

                  setContentView(ScrollView(this).apply {
                      addView(root)
                  })
              }
          }

          class IslandService : Service() {
              private lateinit var wm: WindowManager
              private var pill: TextView? = null
              private lateinit var lp: WindowManager.LayoutParams
              private var expanded = false
              private var startX = 0f
              private var startY = 0f
              private var originX = 0
              private var originY = 0
              private var dragged = false

              override fun onBind(intent: Intent?): IBinder? = null

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              override fun onStartCommand(
                  intent: Intent?, flags: Int, startId: Int
              ): Int {
                  when (intent?.action) {
                      "STOP" -> {
                          removeIsland()
                          return START_NOT_STICKY
                      }
                      "MOVE" -> {
                          if (pill == null) showIsland()
                          if (pill != null) {
                              position(intent.getStringExtra("position") ?: "top")
                          }
                      }
                      else -> showIsland()
                  }
                  return START_NOT_STICKY
              }

              private fun showIsland() {
                  if (!Settings.canDrawOverlays(this) || pill != null) return

                  wm = getSystemService(WINDOW_SERVICE) as WindowManager

                  lp = WindowManager.LayoutParams(
                      dp(220), dp(56),
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = (resources.displayMetrics.widthPixels - dp(220)) / 2
                      y = dp(35)
                  }

                  val view = TextView(this).apply {
                      text = "●    NOW PLAYING    ≋"
                      textSize = 13f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      background = glass(
                          Color.BLACK, 100f, 0xFF438EFF.toInt()
                      )
                      elevation = dp(8).toFloat()

                      setOnTouchListener { v, event ->
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  startX = event.rawX
                                  startY = event.rawY
                                  originX = lp.x
                                  originY = lp.y
                                  dragged = false
                                  true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val dx = (event.rawX - startX).toInt()
                                  val dy = (event.rawY - startY).toInt()

                                  if (kotlin.math.abs(dx) > dp(5) ||
                                      kotlin.math.abs(dy) > dp(5)) {
                                      dragged = true
                                  }

                                  lp.x = (originX + dx).coerceIn(
                                      0,
                                      (resources.displayMetrics.widthPixels -
                                          lp.width).coerceAtLeast(0)
                                  )
                                  lp.y = (originY + dy).coerceIn(
                                      0,
                                      (resources.displayMetrics.heightPixels -
                                          lp.height).coerceAtLeast(0)
                                  )

                                  wm.updateViewLayout(v, lp)
                                  true
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (!dragged) {
                                      expanded = !expanded
                                      lp.width = dp(if (expanded) 270 else 220)
                                      lp.height = dp(if (expanded) 100 else 56)
                                      text = if (expanded)
                                          "DynaIsland Pro\nMUSIC • ACTIVE"
                                      else
                                          "●    NOW PLAYING    ≋"
                                      wm.updateViewLayout(v, lp)
                                  }
                                  true
                              }
                              else -> true
                          }
                      }
                  }

                  pill = view
                  try {
                      wm.addView(view, lp)
                  } catch (e: Exception) {
                      pill = null
                      throw e
                  }
              }

              private fun position(where: String) {
                  val view = pill ?: return
                  val height = resources.displayMetrics.heightPixels

                  lp.y = when (where) {
                      "middle" -> (height - lp.height) / 2
                      "bottom" -> height - lp.height - dp(100)
                      else -> dp(35)
                  }.coerceAtLeast(0)

                  lp.x = (resources.displayMetrics.widthPixels -
                      lp.width) / 2

                  wm.updateViewLayout(view, lp)
              }

              private fun removeIsland() {
                  val view = pill
                  pill = null
                  if (view != null) {
                      try {
                          wm.removeView(view)
                      } catch (_: Exception) {}
                  }
                  stopSelf()
              }

              override fun onDestroy() {
                  val view = pill
                  pill = null
                  if (view != null) {
                      try {
                          wm.removeView(view)
                      } catch (_: Exception) {}
                  }
                  super.onDestroy()
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DynaIsland-Pro-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
